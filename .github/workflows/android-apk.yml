name: APK Android autonome
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Charger la configuration Firebase privée (facultative)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::notice::Aucun secret Firebase : l'APK sera compile sans notifications push Android."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$RUNNER_TEMP/google-services.json"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!p.client?.some(c=>c.client_info?.android_client_info?.package_name==='fr.quranhifz.app'))throw Error('Le fichier Firebase ne correspond pas à fr.quranhifz.app')" "$RUNNER_TEMP/google-services.json"
          echo "GOOGLE_SERVICES_JSON_PATH=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
      - name: Générer le projet natif Android
        run: node node_modules/expo/bin/cli prebuild --platform android --no-install
      - name: Vérifier le projet natif Android
        run: |
          test -f android/app/build.gradle || exit 1
          if [ -n "$GOOGLE_SERVICES_JSON_PATH" ]; then
            test -s android/app/google-services.json || { echo '::error::Firebase absent de l’APK Android'; exit 1; }
          fi
      - name: Compiler l’APK autonome
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: coran-memoire-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
